name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# build and deploy are separate jobs so a transient "Deployment failed, try
# again later" can be retried with "Re-run failed jobs": that re-runs only
# deploy and reuses the already-uploaded artifact. If they lived in one job,
# a re-run would upload a second "github-pages" artifact to the same run and
# deploy-pages@v4 would fail with "Multiple artifacts named github-pages".
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # pnpm before setup-node so setup-node's cache: pnpm can find it.
      # No version here: action-setup reads the pinned packageManager field
      # from package.json (pnpm@11.10.0), matching the version the lockfile and
      # pnpm-workspace.yaml were verified against.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Rebuild the public code-hash lookup from the secret codes
        # Regenerates data/code_hashes.json from private/codes.json so the
        # published validation data can never drift from the real plaque codes.
        # Runs before the Vite build; the build copies data/ into dist/, while
        # private/ is never copied, so the plaintext codes never reach the artifact.
        run: pnpm codes:build
      - name: Build the React static site
        # tsc -b && vite build -> dist/. The copy-static plugin in vite.config.ts
        # pulls assets/, data/, cottages/, legal/, style.css and CNAME into dist/;
        # private/ is deliberately excluded, so no separate strip step is needed.
        run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
