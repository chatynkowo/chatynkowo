<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Ranking Zdobywców — Chatynkowo</title>
  <meta name="description" content="Ranking Zdobywców Chatynkowa — kto odkrył najwięcej baśniowych chatynek Elfów i kto zebrał komplet najszybciej. Dołącz i pochwal się znajomym!"/>

  <!-- Podgląd przy udostępnianiu (FB / Messenger / Twitter). Miniaturka jest
       wspólna dla wszystkich — personalizowany obrazek "z Twoim wynikiem"
       wymagałby generatora OG po stronie serwera (patrz Readme). -->
  <meta property="og:type"        content="website"/>
  <meta property="og:site_name"   content="Chatynkowo"/>
  <meta property="og:title"       content="Ranking Zdobywców — Chatynkowo"/>
  <meta property="og:description" content="Kto odkrył najwięcej chatynek Elfów i zebrał komplet najszybciej? Sprawdź ranking i dołącz do zabawy!"/>
  <meta property="og:url"         content="https://www.chatynkowo.pl/ranking.html"/>
  <meta property="og:image"       content="https://www.chatynkowo.pl/assets/img/logo.webp"/>
  <meta name="twitter:card"       content="summary_large_image"/>

  <link rel="icon" href="assets/img/cropped-znacznik-192x192.png"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="ranking.css"/>
</head>
<body class="rank-page">
  <div class="stars" aria-hidden="true"></div>

  <header class="rank-hero">
    <a class="rank-back" href="index.html">← Wróć do Chatynkowa</a>
    <img src="assets/img/logo.webp" alt="" class="rank-hero__mark" loading="lazy"/>
    <h1 class="rank-hero__title">Ranking Zdobywców</h1>
    <p class="rank-hero__lede">
      Najszybsi zdobywcy kompletu na szczycie, niżej tropiciele wciąż w drodze.
    </p>

    <!-- Pasek konta: zaloguj / Twój wynik / udostępnij -->
    <div class="rank-account" id="rankAccount" aria-live="polite"></div>
  </header>

  <main class="rank-main">
    <!-- Podium top-3 -->
    <section class="podium" id="podium" aria-label="Najlepsza trójka" hidden></section>

    <!-- Pełna lista -->
    <section class="rank-board" aria-label="Pełny ranking">
      <ol class="rank-list" id="rankList"></ol>
      <p class="rank-status" id="rankStatus">Wczytywanie rankingu…</p>
    </section>
  </main>

  <footer class="rank-foot">
    <a href="index.html">Chatynkowo</a> · baśniowe chatynki Elfów
  </footer>

  <!-- Lekki edytor profilu (pseudonim + opcjonalne zdjęcie), pokazywany po zalogowaniu -->
  <dialog class="modal modal--profile" id="profileModal" aria-labelledby="profileTitle">
    <button class="modal__close" id="profileClose" type="button" aria-label="Zamknij">×</button>
    <article class="modal__content">
      <h2 class="modal__title" id="profileTitle">Twój wpis w rankingu</h2>
      <label class="profile-field">
        <span>Pseudonim (widoczny publicznie)</span>
        <input id="profileName" type="text" maxlength="40" autocomplete="off"/>
      </label>
      <label class="profile-check">
        <input id="profileAvatar" type="checkbox"/>
        <span>Pokaż moje zdjęcie z konta Google</span>
      </label>
      <button class="rank-btn rank-btn--primary" id="profileSave" type="button">Zapisz</button>
    </article>
  </dialog>

  <!-- Durable analytics queue (window.chatynkowoStats). No events are fired
       here; loading it just drains any cottage-found events queued offline in
       the field, since completers usually land on the ranking next. The count
       endpoint falls back to its default when this page omits count.js. -->
  <script src="analytics.js" defer></script>
  <script type="module" src="ranking.js"></script>
</body>
</html>
